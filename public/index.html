<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9eff5">
  <title>Visualização 3D</title>
  <meta name="description" content="Visualize o produto em 3D: gire, aproxime e explore todos os detalhes.">
  <meta property="og:title" content="Visualização 3D do produto">
  <meta property="og:description" content="Gire, aproxime e explore o produto em 3D.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d2530'/%3E%3Cpath d='M16 6l9 5v10l-9 5-9-5V11z' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M7 11l9 5 9-5M16 16v10' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
</head>
<body>
  <main class="stage" id="stage">

    <!-- O visualizador 3D (atributos finais são aplicados por js/viewer.js a partir de js/config.js) -->
    <model-viewer id="viewer"
      camera-controls
      disable-tap
      interaction-prompt="none"
      environment-image="neutral"
      tone-mapping="neutral"
      shadow-intensity="0.9"
      shadow-softness="1"
      exposure="1.15"
      loading="eager"
      reveal="auto"
      alt="Modelo 3D interativo do produto">
    </model-viewer>

    <header class="brand" id="brand" hidden>
      <h1 id="titulo"></h1>
      <p id="subtitulo"></p>
    </header>

    <!-- Carregamento -->
    <div class="loader" id="loader" role="status" aria-live="polite">
      <div class="loader__box">
        <span class="loader__label" id="loaderLabel">Carregando</span>
        <span class="loader__bar"><i id="loaderFill"></i></span>
      </div>
    </div>

    <!-- Dica de uso (some na primeira interação) -->
    <p class="hint" id="hint" hidden></p>

    <!-- Controles -->
    <nav class="controls" id="controls" aria-label="Controles do visualizador" hidden>
      <button type="button" id="btnZoomOut" aria-label="Afastar" title="Afastar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
      </button>
      <button type="button" id="btnZoomIn" aria-label="Aproximar" title="Aproximar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <span class="controls__sep" aria-hidden="true"></span>
      <button type="button" id="btnReset" aria-label="Voltar à posição inicial" title="Posição inicial">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4.5v4.6h4.6"/></svg>
      </button>
      <button type="button" id="btnFull" aria-label="Tela cheia" title="Tela cheia">
        <svg class="i-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        <svg class="i-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
      </button>
    </nav>

    <!-- Erro -->
    <div class="error" id="error" role="alert" hidden>
      <div class="error__box">
        <strong id="errorTitle">Não foi possível carregar o 3D</strong>
        <p id="errorMsg"></p>
        <button type="button" id="btnRetry">Tentar novamente</button>
      </div>
    </div>

    <noscript><div class="error"><div class="error__box"><strong>JavaScript desativado</strong><p>Ative o JavaScript do navegador para ver o modelo 3D.</p></div></div></noscript>
  </main>

  <script src="js/config.js"></script>
  <script type="module" src="js/viewer.js"></script>
</body>
</html>
