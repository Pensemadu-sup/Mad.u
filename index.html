<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Catálogo MAD.U</title>
  <meta name="description" content="Visualize o produto em 3D: gire, aproxime e explore todos os detalhes.">
  <meta property="og:title" content="Catálogo MAD.U">
  <meta property="og:description" content="Gire, aproxime e explore o produto em 3D.">
  <link rel="icon" type="image/png" sizes="32x32" href="icones/favicon-32.png?v=8">
  <link rel="icon" type="image/png" sizes="48x48" href="icones/favicon-48.png?v=8">
  <link rel="icon" type="image/png" sizes="192x192" href="icones/icone-192.png?v=8">
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png?v=8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;900&display=swap">
  <link rel="stylesheet" href="css/style.css?v=8">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <style>
    .drawer-hint {
      position: absolute;
      z-index: 3;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 142px);
      transform: translate(-50%, 8px);
      margin: 0;
      padding: 10px 17px;
      max-width: calc(100% - 32px);
      border: 1px solid rgba(255,255,255,.62);
      border-radius: 999px;
      background: rgba(35, 25, 55, .88);
      color: #fff;
      box-shadow: 0 8px 26px rgba(25, 16, 43, .18);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      font: 600 .78rem/1.35 Poppins, sans-serif;
      letter-spacing: .01em;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity .24s ease, transform .24s ease;
    }
    .drawer-hint::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      margin: 0 9px 1px 0;
      border-radius: 50%;
      background: #f39a35;
      box-shadow: 0 0 0 3px rgba(243,154,53,.18);
      vertical-align: middle;
    }
    .drawer-hint.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    .drawer-hint__desktop { display: inline; }
    .drawer-hint__mobile { display: none; }
    @media (max-width: 600px) {
      .drawer-hint {
        bottom: calc(env(safe-area-inset-bottom, 0px) + 142px);
        padding: 9px 13px;
        font-size: .72rem;
        max-width: calc(100% - 24px);
      }
      .drawer-hint__desktop { display: none; }
      .drawer-hint__mobile { display: inline; }
    }
    @media (max-height: 420px) and (orientation: landscape) {
      .drawer-hint { bottom: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .drawer-hint { transition: none; }
    }
  </style>
</head>
<body>
  <!--
  ╔══════════════════════════════════════════════════════════════════════╗
  ║  ÁREA EDITÁVEL — NOME E CAPA DOS PRODUTOS DO CATÁLOGO                ║
  ╚══════════════════════════════════════════════════════════════════════╝
  COMO FUNCIONA
  • Todo arquivo .glb que existir no repositório vira um card sozinho
    (nome provisório = nome do arquivo, sem capa).
  • Para dar nome e capa a um produto, copie uma linha da lista abaixo e
    troque os textos entre aspas:
        modelo : nome do arquivo .glb (caminho a partir da raiz do repositório)
        nome   : nome que aparece no card
        linha  : a linha do produto. Use um destes códigos (exatamente assim):
                 extra  express  expand  one  two  box  set
                 Deixe "" se ainda não souber: o produto aparece só em "Todos".
        capa   : imagem do card (ex.: "capas/produto.jpg"). Deixe "" para usar o ícone.
  • Para a capa: suba a imagem na pasta "capas" do repositório (JPG, PNG ou WEBP, ~800 px).
  • Para ESCONDER um .glb do catálogo: coloque o caminho dele em "esconder".
  • Trocou o arquivo .glb por outro com o mesmo nome? Aumente a "versao" (2, 3...) do produto.
  -->
  <script>
    window.CATALOGO = {
      produtos: [
        { modelo: "produto.glb", nome: "Express MADU000689.22.22", linha: "express", capa: "public/EXPRESS_690_ANGULADO_INOX CINZA.webp", versao: "1" },
      ],

      categorias: [
        { id: "extra", rotulo: "Extra" },
        { id: "express", rotulo: "Express" },
        { id: "expand", rotulo: "Expand" },
        { id: "one", rotulo: "One" },
        { id: "two", rotulo: "Two" },
        { id: "box", rotulo: "Box" },
        { id: "set", rotulo: "Set" }
      ],

      esconder: ["AnimadinhosOne1.1glb.glb"],
      repositorio: "Pensemadu-sup/Mad.u",
      branch: "main",
      ignorarPastas: ["public/", "node_modules/"],
      descobrirAutomaticamente: true,

      site: { titulo: "Catálogo MAD.U", url: "https://www.pensemadu.com.br/" }
    };
  </script>

  <a class="skip" href="#catalogo">Ir para o catálogo</a>

  <div id="viewCatalogo">
    <header class="topo">
      <div class="topo__in">
        <a class="marca" href="https://www.pensemadu.com.br/" aria-label="MAD.U — ir para o site">MAD.U</a>
        <a class="topo__link" href="https://www.pensemadu.com.br/">Voltar ao site</a>
      </div>
    </header>
    <div class="filtros-barra">
      <div class="filtros" id="filtros" role="group" aria-label="Filtrar produtos"></div>
    </div>
    <main class="pagina" id="catalogo" tabindex="-1">
      <h1 id="tituloCatalogo">Catálogo MAD.U</h1>
      <p class="sr-only" id="contagem" role="status" aria-live="polite"></p>
      <ul class="grade" id="grade"></ul>
      <p class="vazio" id="vazio" hidden>Nenhum produto neste filtro.</p>
      <noscript><p class="vazio">Ative o JavaScript do navegador para ver o catálogo em 3D.</p></noscript>
    </main>
  </div>

  <section class="stage" id="stage" hidden aria-label="Visualizador 3D">
    <model-viewer id="viewer" camera-controls disable-tap interaction-prompt="none" environment-image="neutral" tone-mapping="neutral" shadow-intensity="0.9" shadow-softness="1" exposure="1.15" loading="eager" reveal="auto" alt="Modelo 3D interativo do produto"></model-viewer>
    <div class="viewer-top">
      <button type="button" class="btn-voltar" id="btnVoltar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Voltar ao catálogo</span></button>
      <div class="viewer-top__txt"><p id="vCategoria" hidden></p><h2 id="vNome"></h2></div>
    </div>
    <div class="loader" id="loader" role="status" aria-live="polite"><div class="loader__box"><span class="loader__label" id="loaderLabel">Carregando</span><span class="loader__bar"><i id="loaderFill"></i></span></div></div>
    <p class="hint" id="hint" hidden></p>
    <p class="drawer-hint" id="drawerHint" hidden>
      <span class="drawer-hint__desktop">Clique na primeira gaveta para abrir ou fechar</span>
      <span class="drawer-hint__mobile">Toque na primeira gaveta para abrir ou fechar</span>
    </p>
    <nav class="controls" id="controls" aria-label="Controles do visualizador" hidden>
      <button type="button" id="btnZoomOut" aria-label="Afastar" title="Afastar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <button type="button" id="btnZoomIn" aria-label="Aproximar" title="Aproximar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <span class="controls__sep" aria-hidden="true"></span>
      <button type="button" id="btnReset" aria-label="Voltar à posição inicial" title="Posição inicial"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4.5v4.6h4.6"/></svg></button>
      <button type="button" id="btnFull" aria-label="Tela cheia" title="Tela cheia"><svg class="i-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><svg class="i-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>
    </nav>
    <div class="error" id="error" role="alert" hidden>
      <div class="error__box">
        <strong id="errorTitle">Não foi possível carregar o 3D</strong>
        <p id="errorMsg"></p>
        <div class="error__acoes">
          <button type="button" id="btnRetry">Tentar novamente</button>
          <button type="button" class="sec" id="btnVoltarErro">Voltar ao catálogo</button>
        </div>
      </div>
    </div>
  </section>

  <script src="js/config.js?v=8"></script>
  <script type="module" src="js/viewer.js?v=8"></script>
  <script src="js/animacao.js?v=3"></script>
</body>
</html>
